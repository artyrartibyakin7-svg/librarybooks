{% extends 'library/base.html' %}
{% load crispy_forms_tags %}
{% block title %}Регистрация - Системауправления библиотекой{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Регистрация</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form | crispy }}
                        <button type="submit" class="btn btn-success">
                            Зарегистрироваться
                        </button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <p>
                        Уже есть учетная запись?
                        <a href="{% url 'login' %}">Войдите здесь</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
