{% extends 'library/base.html' %} {% block title %}Вход - Система управления
библиотекой{% endblock %} {% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Вход</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label"
                            >Имя пользователя</label
                        >
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            required
                        />
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            required
                        />
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">
                            Вход
                        </button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <p>
                        Нет учетной записи?
                        <a href="{% url 'register' %}"
                            >Зарегистрируйтесь здесь</a
                        >
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
